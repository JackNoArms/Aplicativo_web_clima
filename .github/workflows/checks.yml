name: Python tests and safety

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests without external API
        run: python -m pytest tests/ -q
      - name: Compile sources
        run: python -m compileall -q app.py pages services tests
